<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E15"/>
      <stop offset="40%" stop-color="#0E140F"/>
      <stop offset="100%" stop-color="#070908"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#15803D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="360" height="640" fill="url(#auraBg)"/>
  <rect width="360" height="640" fill="url(#amberGlow)"/>

  <!-- Viewfinder Grid -->
  <line x1="30" y1="213" x2="330" y2="213" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="3 3"/>
  <line x1="30" y1="426" x2="330" y2="426" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="3 3"/>
  <line x1="120" y1="30" x2="120" y2="610" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="3 3"/>
  <line x1="240" y1="30" x2="240" y2="610" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="3 3"/>

  <!-- Corner Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 340 40 L 340 20 L 320 20" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 20 600 L 20 620 L 40 620" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 340 600 L 340 620 L 320 620" stroke="#C6FF3D" stroke-width="2" fill="none"/>

  <!-- Top Telemetry -->
  <circle cx="36" cy="36" r="4" fill="#C6FF3D"/>
  <text x="48" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#EDEAE3">FRAME 01 // 4K 60P</text>
  <text x="260" y="40" font-family="monospace" font-size="11" fill="#C6FF3D">00:04:18:12</text>

  <!-- Botanical Product Dropper & Molecule Graphic -->
  <g transform="translate(180, 270)">
    <!-- Aura Dropper Pipette silhouette -->
    <rect x="-8" y="-90" width="16" height="50" rx="3" fill="#222" stroke="#444" stroke-width="1.5"/>
    <path d="M -18 -40 L 18 -40 L 12 60 L -12 60 Z" fill="#181818" stroke="#555" stroke-width="2"/>
    <rect x="-6" y="-20" width="12" height="60" fill="#EAB308" fill-opacity="0.5"/>
    <!-- Liquid Amber Drop -->
    <path d="M 0 75 C -10 95, -10 105, 0 115 C 10 105, 10 95, 0 75 Z" fill="#EAB308" stroke="#C6FF3D" stroke-width="1.5"/>
    <!-- Molecular rings -->
    <circle cx="0" cy="15" r="90" fill="none" stroke="#22C55E" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="0" cy="15" r="120" fill="none" stroke="#C6FF3D" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 4"/>
  </g>

  <!-- Center Hook Badge -->
  <rect x="35" y="415" width="290" height="70" fill="#0A0A0A" fill-opacity="0.85" stroke="#C6FF3D" stroke-width="1"/>
  <text x="50" y="440" font-family="monospace" font-size="10" font-weight="bold" fill="#C6FF3D">[HOOK TEST A/B: BIO-AVAILABILITY]</text>
  <text x="50" y="462" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">"Why 82% of Adaptogens Never Absorb."</text>

  <!-- Audio Waveform -->
  <g transform="translate(35, 530)">
    <line x1="0" y1="15" x2="0" y2="25" stroke="#C6FF3D" stroke-width="2"/>
    <line x1="6" y1="8" x2="6" y2="32" stroke="#C6FF3D" stroke-width="2"/>
    <line x1="12" y1="2" x2="12" y2="38" stroke="#C6FF3D" stroke-width="2"/>
    <line x1="18" y1="12" x2="18" y2="28" stroke="#C6FF3D" stroke-width="2"/>
    <line x1="24" y1="5" x2="24" y2="35" stroke="#C6FF3D" stroke-width="2"/>
    <line x1="30" y1="14" x2="30" y2="26" stroke="#C6FF3D" stroke-width="2"/>
    <text x="42" y="24" font-family="monospace" font-size="10" fill="#EDEAE3">Aura • Sound of Clarity (Raw Mix)</text>
  </g>

  <!-- Bottom Metric Banner -->
  <rect x="20" y="570" width="320" height="40" fill="#111" stroke="#262626" stroke-width="1"/>
  <text x="35" y="594" font-family="monospace" font-size="11" fill="#8A8A85">SCALE METRIC:</text>
  <text x="130" y="595" font-family="monospace" font-size="14" font-weight="bold" fill="#C6FF3D">4.82x ROAS</text>
  <text x="245" y="594" font-family="monospace" font-size="11" fill="#EDEAE3">+380% REV</text>
</svg>
