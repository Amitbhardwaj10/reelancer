<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="veloceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1817"/>
      <stop offset="60%" stop-color="#0F0E0D"/>
      <stop offset="100%" stop-color="#070706"/>
    </linearGradient>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="360" height="640" fill="url(#veloceBg)"/>
  <rect width="360" height="640" fill="url(#scanlines)"/>

  <!-- Corner Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 340 40 L 340 20 L 320 20" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 20 600 L 20 620 L 40 620" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 340 600 L 340 620 L 320 620" stroke="#C6FF3D" stroke-width="2" fill="none"/>

  <!-- Top Telemetry -->
  <circle cx="36" cy="36" r="4" fill="#FF5A36"/>
  <text x="48" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#FF5A36">DROP NIGHT // LIVE</text>
  <text x="260" y="40" font-family="monospace" font-size="11" fill="#C6FF3D">00:12:05:18</text>

  <!-- Brutalist Streetwear Silhouette / Mockup -->
  <g transform="translate(180, 240)">
    <!-- Heavy Boxy Hoodie Outline -->
    <path d="M -70 -70 L -40 -90 L 40 -90 L 70 -70 L 105 -10 L 80 15 L 60 -10 L 60 110 L -60 110 L -60 -10 L -80 15 L -105 -10 Z" fill="#141414" stroke="#444444" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" letter-spacing="4" fill="#EDEAE3">VÉLOCE</text>
    <text x="0" y="32" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="2" fill="#C6FF3D">CAPSULE 04 • 1/1200</text>
    <!-- Crosshairs -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="-125" y1="0" x2="125" y2="0" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="0" y1="-125" x2="0" y2="125" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  </g>

  <!-- Countdown / Velocity Banner -->
  <rect x="25" y="405" width="310" height="95" fill="#0E0E0E" stroke="#FF5A36" stroke-width="1"/>
  <div xmlns="http://www.w3.org/1999/xhtml">
    <text x="40" y="432" font-family="monospace" font-size="10" font-weight="bold" fill="#FF5A36">[INVENTORY DEPLETION SPEED]</text>
    <text x="40" y="460" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1,200 UNITS • 18 MINUTES</text>
    <text x="40" y="485" font-family="monospace" font-size="11" fill="#8A8A85">SMS Gate: 8.2k VIPs • Zero Retargeting Lag</text>
  </div>

  <!-- Audio Waveform -->
  <g transform="translate(35, 545)">
    <circle cx="8" cy="8" r="8" fill="#FF5A36" fill-opacity="0.2"/>
    <polygon points="6,4 12,8 6,12" fill="#FF5A36"/>
    <text x="24" y="12" font-family="monospace" font-size="10" fill="#EDEAE3">VÉLOCE • Midnight Capsule Theme</text>
  </g>

  <!-- Bottom Metric Banner -->
  <rect x="20" y="570" width="320" height="40" fill="#111" stroke="#262626" stroke-width="1"/>
  <text x="35" y="594" font-family="monospace" font-size="11" fill="#8A8A85">SCALE METRIC:</text>
  <text x="130" y="595" font-family="monospace" font-size="14" font-weight="bold" fill="#C6FF3D">$85.2K / 18M</text>
  <text x="245" y="594" font-family="monospace" font-size="11" fill="#EDEAE3">+490% ENG</text>
</svg>
