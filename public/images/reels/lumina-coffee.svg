<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="luminaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241412"/>
      <stop offset="50%" stop-color="#140C0B"/>
      <stop offset="100%" stop-color="#080505"/>
    </linearGradient>
    <radialGradient id="coffeeGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="360" height="640" fill="url(#luminaBg)"/>
  <rect width="360" height="640" fill="url(#coffeeGlow)"/>

  <!-- Corner Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 340 40 L 340 20 L 320 20" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 20 600 L 20 620 L 40 620" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 340 600 L 340 620 L 320 620" stroke="#C6FF3D" stroke-width="2" fill="none"/>

  <!-- Top Telemetry -->
  <circle cx="36" cy="36" r="4" fill="#C6FF3D"/>
  <text x="48" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#EDEAE3">FRAME 06 // SENSORY ASMR</text>
  <text x="260" y="40" font-family="monospace" font-size="11" fill="#C6FF3D">00:24:00:00</text>

  <!-- Pour-Over Carafe & Dripper Vector -->
  <g transform="translate(180, 240)">
    <!-- Dripper cone -->
    <polygon points="-50,-70 50,-70 12,0 -12,0" fill="#1A1A1A" stroke="#555" stroke-width="2"/>
    <!-- Extraction Drip Stream -->
    <line x1="0" y1="0" x2="0" y2="40" stroke="#E11D48" stroke-width="2.5"/>
    <circle cx="0" cy="45" r="3.5" fill="#E11D48"/>
    <!-- Glass Carafe -->
    <path d="M -25 35 L 25 35 L 50 110 L -50 110 Z" fill="#0C0A09" stroke="#666" stroke-width="2"/>
    <!-- Liquid Level -->
    <path d="M -38 85 L 38 85 L 48 108 L -48 108 Z" fill="#991B1B" fill-opacity="0.6"/>
    <!-- Steam Swirls -->
    <path d="M -15 -85 C -25 -105, -5 -115, -15 -130" fill="none" stroke="#C6FF3D" stroke-opacity="0.4" stroke-width="1.5"/>
    <path d="M 10 -85 C 20 -105, 5 -115, 12 -135" fill="none" stroke="#C6FF3D" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <!-- Metric Callout -->
  <rect x="25" y="415" width="310" height="85" fill="#0A0A0A" fill-opacity="0.9" stroke="#C6FF3D" stroke-width="1"/>
  <text x="40" y="442" font-family="monospace" font-size="10" font-weight="bold" fill="#C6FF3D">[SPECIALTY SUBSCRIPTION RETENTION]</text>
  <text x="40" y="468" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">6.2x Meta ROAS • 88.4% 90-Day Retention</text>
  <text x="40" y="488" font-family="monospace" font-size="10" fill="#8A8A85">1,180 Active Coffee Subscribers</text>

  <!-- Audio Waveform -->
  <g transform="translate(35, 545)">
    <circle cx="8" cy="8" r="8" fill="#C6FF3D" fill-opacity="0.2"/>
    <polygon points="6,4 12,8 6,12" fill="#C6FF3D"/>
    <text x="24" y="12" font-family="monospace" font-size="10" fill="#EDEAE3">Lumina • Pour Over Vinyl & Rain</text>
  </g>

  <!-- Bottom Metric Banner -->
  <rect x="20" y="570" width="320" height="40" fill="#111" stroke="#262626" stroke-width="1"/>
  <text x="35" y="594" font-family="monospace" font-size="11" fill="#8A8A85">SCALE METRIC:</text>
  <text x="130" y="595" font-family="monospace" font-size="14" font-weight="bold" fill="#C6FF3D">6.2X ROAS</text>
  <text x="245" y="594" font-family="monospace" font-size="11" fill="#EDEAE3">88% RETENTION</text>
</svg>
