<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="kineticsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1610"/>
      <stop offset="50%" stop-color="#120D0A"/>
      <stop offset="100%" stop-color="#080605"/>
    </linearGradient>
  </defs>

  <rect width="360" height="640" fill="url(#kineticsBg)"/>

  <!-- Corner Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 340 40 L 340 20 L 320 20" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 20 600 L 20 620 L 40 620" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 340 600 L 340 620 L 320 620" stroke="#C6FF3D" stroke-width="2" fill="none"/>

  <!-- Top Telemetry -->
  <circle cx="36" cy="36" r="4" fill="#C6FF3D"/>
  <text x="48" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#EDEAE3">FRAME 05 // BIOMECHANICS</text>
  <text x="260" y="40" font-family="monospace" font-size="11" fill="#C6FF3D">00:20:11:15</text>

  <!-- Biomechanics Motion Skeleton Vector & Telemetry -->
  <g transform="translate(180, 240)">
    <!-- Skeletal joint vector -->
    <circle cx="0" cy="-80" r="14" fill="#1C1C1C" stroke="#F97316" stroke-width="2"/>
    <line x1="0" y1="-66" x2="0" y2="10" stroke="#EDEAE3" stroke-width="3"/>
    <!-- Shoulders & Arms with angle arc -->
    <line x1="-45" y1="-45" x2="45" y2="-45" stroke="#EDEAE3" stroke-width="2.5"/>
    <line x1="-45" y1="-45" x2="-65" y2="25" stroke="#C6FF3D" stroke-width="2"/>
    <line x1="45" y1="-45" x2="65" y2="25" stroke="#C6FF3D" stroke-width="2"/>
    <!-- Angle measurement arc -->
    <path d="M -45 -15 A 30 30 0 0 1 -20 -45" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="-75" y="-25" font-family="monospace" font-size="10" font-weight="bold" fill="#F97316">87.4°</text>
    <!-- Legs & Hip Angle -->
    <line x1="0" y1="10" x2="-35" y2="85" stroke="#EDEAE3" stroke-width="3"/>
    <line x1="0" y1="10" x2="35" y2="85" stroke="#EDEAE3" stroke-width="3"/>
    <!-- Knee Joints with targets -->
    <circle cx="-35" cy="85" r="5" fill="#C6FF3D"/>
    <circle cx="35" cy="85" r="5" fill="#C6FF3D"/>
  </g>

  <!-- Metric Callout -->
  <rect x="25" y="415" width="310" height="85" fill="#0A0A0A" fill-opacity="0.9" stroke="#C6FF3D" stroke-width="1"/>
  <text x="40" y="442" font-family="monospace" font-size="10" font-weight="bold" fill="#C6FF3D">[COMMENT-TO-DM FUNNEL]</text>
  <text x="40" y="468" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">1,420 Active Recurring Members</text>
  <text x="40" y="488" font-family="monospace" font-size="10" fill="#8A8A85">31.2k DM Chats • 14.8% Paid Conversion</text>

  <!-- Audio Waveform -->
  <g transform="translate(35, 545)">
    <circle cx="8" cy="8" r="8" fill="#C6FF3D" fill-opacity="0.2"/>
    <polygon points="6,4 12,8 6,12" fill="#C6FF3D"/>
    <text x="24" y="12" font-family="monospace" font-size="10" fill="#EDEAE3">Kinetics • High Heart Rate Trap</text>
  </g>

  <!-- Bottom Metric Banner -->
  <rect x="20" y="570" width="320" height="40" fill="#111" stroke="#262626" stroke-width="1"/>
  <text x="35" y="594" font-family="monospace" font-size="11" fill="#8A8A85">SCALE METRIC:</text>
  <text x="130" y="595" font-family="monospace" font-size="14" font-weight="bold" fill="#C6FF3D">+175% MRR</text>
  <text x="245" y="594" font-family="monospace" font-size="11" fill="#EDEAE3">$68.1K / MO</text>
</svg>
