<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="nexusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#080C1A"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>
    <linearGradient id="codeGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="360" height="640" fill="url(#nexusBg)"/>
  <rect width="360" height="640" fill="url(#codeGlow)"/>

  <!-- Corner Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 340 40 L 340 20 L 320 20" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 20 600 L 20 620 L 40 620" stroke="#C6FF3D" stroke-width="2" fill="none"/>
  <path d="M 340 600 L 340 620 L 320 620" stroke="#C6FF3D" stroke-width="2" fill="none"/>

  <!-- Top Telemetry -->
  <circle cx="36" cy="36" r="4" fill="#C6FF3D"/>
  <text x="48" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#EDEAE3">FRAME 02 // DEV LOG</text>
  <text x="260" y="40" font-family="monospace" font-size="11" fill="#C6FF3D">00:08:24:00</text>

  <!-- Terminal Window Graphic -->
  <g transform="translate(25, 90)">
    <rect width="310" height="340" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
    <!-- Terminal Header -->
    <rect width="310" height="28" rx="4" fill="#161B22"/>
    <circle cx="16" cy="14" r="4" fill="#FF5F56"/>
    <circle cx="28" cy="14" r="4" fill="#FFBD2E"/>
    <circle cx="40" cy="14" r="4" fill="#27C93F"/>
    <text x="100" y="18" font-family="monospace" font-size="10" fill="#8B949E">nexus-core-runtime v2.4</text>

    <!-- Code Lines -->
    <text x="16" y="55" font-family="monospace" font-size="11" fill="#FF7B72">import</text>
    <text x="65" y="55" font-family="monospace" font-size="11" fill="#79C0FF">{ initNexus }</text>
    <text x="165" y="55" font-family="monospace" font-size="11" fill="#FF7B72">from</text>
    <text x="200" y="55" font-family="monospace" font-size="11" fill="#A5D6FF">'@nexus/sdk'</text>

    <text x="16" y="80" font-family="monospace" font-size="11" fill="#FFA657">const</text>
    <text x="56" y="80" font-family="monospace" font-size="11" fill="#79C0FF">engine</text>
    <text x="105" y="80" font-family="monospace" font-size="11" fill="#FF7B72">=</text>
    <text x="120" y="80" font-family="monospace" font-size="11" fill="#D2A8FF">await</text>
    <text x="160" y="80" font-family="monospace" font-size="11" fill="#79C0FF">initNexus({</text>

    <text x="32" y="105" font-family="monospace" font-size="11" fill="#7EE787">concurrency:</text>
    <text x="125" y="105" font-family="monospace" font-size="11" fill="#79C0FF">100_000,</text>

    <text x="32" y="128" font-family="monospace" font-size="11" fill="#7EE787">zeroColdStart:</text>
    <text x="135" y="128" font-family="monospace" font-size="11" fill="#C6FF3D">true,</text>

    <text x="32" y="150" font-family="monospace" font-size="11" fill="#7EE787">latencyP99:</text>
    <text x="120" y="150" font-family="monospace" font-size="11" fill="#A5D6FF">'1.2ms'</text>

    <text x="16" y="175" font-family="monospace" font-size="11" fill="#79C0FF">});</text>

    <!-- Execution Output -->
    <rect x="16" y="195" width="278" height="125" fill="#05080E" stroke="#21262D" stroke-width="1"/>
    <text x="26" y="218" font-family="monospace" font-size="10" fill="#7EE787">➜ Benchmarking 100k requests...</text>
    <text x="26" y="240" font-family="monospace" font-size="10" fill="#C6FF3D">✓ Execution completed in 84ms</text>
    <text x="26" y="262" font-family="monospace" font-size="10" fill="#8B949E">Memory footprint: 14.2MB</text>
    <text x="26" y="285" font-family="monospace" font-size="10" fill="#38BDF8">Signups: 18,500 active devs</text>
    <!-- Blinking Cursor -->
    <rect x="200" y="275" width="7" height="12" fill="#C6FF3D"/>
  </g>

  <!-- Metric Callout -->
  <rect x="25" y="455" width="310" height="75" fill="#0A0A0A" fill-opacity="0.9" stroke="#C6FF3D" stroke-width="1"/>
  <text x="40" y="480" font-family="monospace" font-size="10" font-weight="bold" fill="#C6FF3D">[ENGINEER ACQUISITION MATRIX]</text>
  <text x="40" y="505" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">18.5k Free Tier Signups • $18.40 CPL</text>

  <!-- Audio Waveform -->
  <g transform="translate(35, 545)">
    <circle cx="8" cy="8" r="8" fill="#C6FF3D" fill-opacity="0.2"/>
    <polygon points="6,4 12,8 6,12" fill="#C6FF3D"/>
    <text x="24" y="12" font-family="monospace" font-size="10" fill="#EDEAE3">Nexus • Terminal Beats 128BPM</text>
  </g>

  <!-- Bottom Metric Banner -->
  <rect x="20" y="570" width="320" height="40" fill="#111" stroke="#262626" stroke-width="1"/>
  <text x="35" y="594" font-family="monospace" font-size="11" fill="#8A8A85">SCALE METRIC:</text>
  <text x="130" y="595" font-family="monospace" font-size="14" font-weight="bold" fill="#C6FF3D">+212% REACH</text>
  <text x="240" y="594" font-family="monospace" font-size="11" fill="#EDEAE3">44 DEMOS</text>
</svg>
